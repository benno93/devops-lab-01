events {}

http {
    default_type  text/html;

    server {
        listen 8080;

        location /api/ {
            proxy_pass http://127.0.0.1:5001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root   .;
            index  index.html;
        }
    }
}