events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;

        # Reverse Proxy zum Backend-Service.
        # "backend" ist der Kubernetes-Service-Name (ClusterIP) bzw. beim
        # nativen/Compose-Betrieb ueber ein Hostalias/--link aufzuloesen.
        location /api/ {
            proxy_pass http://backend:5001/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ =404;
        }
    }
}
